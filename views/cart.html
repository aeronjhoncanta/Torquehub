<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - TorqueHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Cart Specific Styles */
        .cart-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .cart-header h1 {
            color: var(--primary-dark);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .cart-header p {
            color: var(--text);
            font-size: 1.1rem;
        }

        .cart-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .cart-items {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(179,153,212,0.1);
            border: 1px solid var(--primary-light);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.5rem;
            border-bottom: 1px solid var(--primary-light);
            transition: all 0.3s ease;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item:hover {
            background: var(--primary-light);
            border-radius: 10px;
        }

        .cart-item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--primary-light);
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .cart-item-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .cart-item-category {
            font-size: 0.9rem;
            color: var(--text);
            opacity: 0.8;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-btn {
            width: 35px;
            height: 35px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .quantity-btn:hover {
            background: var(--primary);
            color: white;
        }

        .quantity-display {
            min-width: 40px;
            text-align: center;
            font-weight: 600;
            color: var(--primary-dark);
        }

        .cart-item-total {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-dark);
            min-width: 100px;
            text-align: right;
        }

        .remove-item-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .remove-item-btn:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .cart-summary {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(179,153,212,0.1);
            border: 1px solid var(--primary-light);
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .summary-header {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--primary-light);
        }

        .summary-item:last-child {
            border-bottom: none;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-dark);
        }

        .summary-label {
            color: var(--text);
        }

        .summary-value {
            font-weight: 600;
            color: var(--primary-dark);
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(179,153,212,0.3);
        }

        .checkout-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text);
        }

        .empty-cart i {
            font-size: 4rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }

        .empty-cart h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-dark);
        }

        .empty-cart p {
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .continue-shopping-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .continue-shopping-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .loading-cart {
            text-align: center;
            padding: 2rem;
            color: var(--primary-dark);
        }

        .loading-cart .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--primary-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .cart-content {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .cart-item {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }

            .cart-item-image {
                width: 80px;
                height: 80px;
            }

            .cart-item-quantity {
                justify-content: center;
            }

            .cart-item-total {
                text-align: center;
            }
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            background-color: #4CAF50;
            color: white;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            animation: fadeIn 0.3s ease;
            font-weight: 500;
            max-width: 300px;
            word-wrap: break-word;
        }

        .toast.error {
            background-color: #F44336;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header class="shoppee-header">
        <img src="/images/logo.png" alt="TORQUEHUB Logo" class="shoppee-logo">
        <h1>TORQUEHUB SHOPPING CART</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="main-nav-strip">
        <div class="nav-strip-container">
            <ul class="nav-strip-list">
                <li class="nav-strip-item">
                    <a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-strip-item">
                    <a href="/dashboard#motorcycle"><i class="fas fa-motorcycle"></i> Motorcycles</a>
                </li>
                <li class="nav-strip-item">
                    <a href="/dashboard#parts"><i class="fas fa-cogs"></i> Parts</a>
                </li>
                <li class="nav-strip-item">
                    <a href="/dashboard#services"><i class="fas fa-tools"></i> Services</a>
                </li>
                <li class="nav-strip-item nav-icon nav-cart">
                    <a href="/cart" aria-label="Cart" style="background: var(--primary); color: white;">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </li>
                <li class="nav-strip-item nav-icon nav-checkout">
                    <a href="/checkout" aria-label="Checkout"><i class="fas fa-credit-card"></i> Checkout</a>
                </li>
                <li class="nav-strip-item" id="my-orders-link">
                    <a href="/transaction-management"><i class="fas fa-list"></i> My Orders</a>
                </li>
                <li class="nav-strip-item">
                    <a href="/purchase-history"><i class="fas fa-history"></i> Purchase History</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="cart-container">
        <div class="cart-header">
            <h1><i class="fas fa-shopping-cart"></i> Your Shopping Cart</h1>
            <p>Review your items and proceed to checkout</p>
        </div>

        <div class="cart-content">
            <!-- Cart Items Section -->
            <div class="cart-items">
                <div id="cartItems">
                    <div class="loading-cart">
                        <div class="spinner"></div>
                        <p>Loading your cart...</p>
                    </div>
                </div>
            </div>

            <!-- Cart Summary Section -->
            <div class="cart-summary">
                <div class="summary-header">
                    <i class="fas fa-receipt"></i> Order Summary
                </div>
                <div id="cartSummary">
                    <div class="summary-item">
                        <span class="summary-label">Subtotal:</span>
                        <span class="summary-value" id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Tax (10%):</span>
                        <span class="summary-value" id="tax">$0.00</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Shipping:</span>
                        <span class="summary-value" id="shipping">$0.00</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Total:</span>
                        <span class="summary-value" id="total">$0.00</span>
                    </div>
                </div>
                <button class="checkout-btn" id="checkoutBtn" disabled>
                    <i class="fas fa-credit-card"></i> Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let products = [];

        // Load products from database
        async function loadProducts() {
            try {
                const response = await fetch('/api/products', {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    products = await response.json();
                    displayCart();
                } else {
                    throw new Error('Failed to load products');
                }
            } catch (error) {
                console.error('Error loading products:', error);
                showToast('Failed to load products', 'error');
            }
        }

        // Display cart items
        function displayCart() {
            const cartItemsContainer = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>Your cart is empty</h3>
                        <p>Add some products to your cart to get started!</p>
                        <a href="/dashboard" class="continue-shopping-btn">
                            <i class="fas fa-arrow-left"></i> Continue Shopping
                        </a>
                    </div>
                `;
                updateCartSummary();
                return;
            }

            const cartItemsHTML = cart.map(item => {
                const product = products.find(p => p.id === item.productId);
                if (!product) return '';

                const itemTotal = product.price * item.quantity;
                
                return `
                    <div class="cart-item" data-product-id="${item.productId}">
                        <img src="${product.image || '/images/illus.png'}" 
                             alt="${product.name}" 
                             class="cart-item-image"
                             onerror="this.src='/images/illus.png'">
                        <div class="cart-item-details">
                            <div class="cart-item-name">${product.name}</div>
                            <div class="cart-item-price">$${parseFloat(product.price).toLocaleString()}</div>
                            <div class="cart-item-category">${product.category || 'Product'}</div>
                        </div>
                        <div class="cart-item-quantity">
                            <div class="quantity-controls">
                                <button class="quantity-btn" onclick="updateQuantity(${item.productId}, -1)">-</button>
                                <span class="quantity-display">${item.quantity}</span>
                                <button class="quantity-btn" onclick="updateQuantity(${item.productId}, 1)">+</button>
                            </div>
                        </div>
                        <div class="cart-item-total">$${itemTotal.toLocaleString()}</div>
                        <button class="remove-item-btn" onclick="removeFromCart(${item.productId})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');

            cartItemsContainer.innerHTML = cartItemsHTML;
            updateCartSummary();
        }

        // Update quantity
        function updateQuantity(productId, change) {
            const cartItem = cart.find(item => item.productId === productId);
            if (cartItem) {
                cartItem.quantity += change;
                
                if (cartItem.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    saveCart();
                    displayCart();
                    updateCartCount();
                }
            }
        }

        // Remove item from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.productId !== productId);
            saveCart();
            displayCart();
            updateCartCount();
            showToast('Item removed from cart', 'success');
        }

        // Save cart to localStorage
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        // Update cart summary
        function updateCartSummary() {
            let subtotal = 0;
            
            cart.forEach(item => {
                const product = products.find(p => p.id === item.productId);
                if (product) {
                    subtotal += product.price * item.quantity;
                }
            });

            const tax = subtotal * 0.10; // 10% tax
            const shipping = subtotal > 0 ? 25 : 0; // $25 shipping if items in cart
            const total = subtotal + tax + shipping;

            document.getElementById('subtotal').textContent = `$${subtotal.toLocaleString()}`;
            document.getElementById('tax').textContent = `$${tax.toLocaleString()}`;
            document.getElementById('shipping').textContent = `$${shipping.toLocaleString()}`;
            document.getElementById('total').textContent = `$${total.toLocaleString()}`;

            // Enable/disable checkout button
            const checkoutBtn = document.getElementById('checkoutBtn');
            checkoutBtn.disabled = cart.length === 0;
        }

        // Update cart count in navigation
        function updateCartCount() {
            const cartCount = document.getElementById('cartCount');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.remove();
                }
            }, 3000);
        }

        // Checkout functionality
        document.getElementById('checkoutBtn').addEventListener('click', function() {
            if (cart.length === 0) {
                showToast('Your cart is empty', 'error');
                return;
            }
            
            // Redirect to checkout page
            window.location.href = '/checkout';
        });

        // Listen for cart changes from other pages
        window.addEventListener('storage', function(e) {
            if (e.key === 'cart') {
                cart = JSON.parse(e.newValue || '[]');
                displayCart();
                updateCartCount();
            }
        });

        // User profile management
        async function fetchUserProfile() {
            try {
                const response = await fetch('/api/profile?t=' + Date.now(), {
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        // User not authenticated, redirect to login
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const user = await response.json();
                updateMyOrdersLinkVisibility(user);
            } catch (error) {
                console.error('Profile error:', error);
                // Hide My Orders link for guests
                const myOrdersLink = document.getElementById('my-orders-link');
                if (myOrdersLink) {
                    myOrdersLink.style.display = 'none';
                }
            }
        }

        function updateMyOrdersLinkVisibility(user) {
            const myOrdersLink = document.getElementById('my-orders-link');
            
            if (myOrdersLink) {
                if (user.role && user.role.toLowerCase() === 'admin') {
                    myOrdersLink.style.display = 'block';
                } else {
                    myOrdersLink.style.display = 'none';
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            updateCartCount();
            fetchUserProfile();
        });
    </script>
</body>
</html>
