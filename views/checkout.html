<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TorqueHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .checkout-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .checkout-header h1 {
            color: var(--primary-dark);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .checkout-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .checkout-form {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(179,153,212,0.1);
            border: 1px solid var(--primary-light);
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section h3 {
            color: var(--primary-dark);
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary-dark);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--primary-light);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(179,153,212,0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .order-summary {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(179,153,212,0.1);
            border: 1px solid var(--primary-light);
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .summary-header {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .order-items {
            margin-bottom: 1.5rem;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--primary-light);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
            color: var(--primary-dark);
        }

        .item-price {
            font-weight: 600;
            color: var(--primary);
        }

        .total-section {
            border-top: 2px solid var(--primary-light);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .total-row.final {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            border-top: 1px solid var(--primary-light);
            padding-top: 0.5rem;
            margin-top: 0.5rem;
        }

        .place-order-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .place-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(179,153,212,0.3);
        }

        .place-order-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text);
        }

        .empty-cart i {
            font-size: 4rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }

        .empty-cart h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-dark);
        }

        .empty-cart p {
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .continue-shopping-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .continue-shopping-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .success-message {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(179,153,212,0.1);
            border: 1px solid var(--primary-light);
            text-align: center;
            margin-bottom: 2rem;
        }

        .success-message i {
            font-size: 3rem;
            color: #28a745;
            margin-bottom: 1rem;
        }

        .success-message h3 {
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }

        .success-message .transaction-details {
            background: var(--primary-light);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        /* Success Popup Styles */
        .success-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .success-popup {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        .success-popup i {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 1rem;
        }

        .success-popup h3 {
            color: var(--primary-dark);
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .success-popup p {
            color: var(--text);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .success-popup .order-details {
            background: var(--primary-light);
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            text-align: left;
        }

        .success-popup .order-details h4 {
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .success-popup .order-details p {
            margin: 0.25rem 0;
            color: var(--text);
        }

        .success-popup .popup-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .success-popup .popup-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .success-popup .btn-primary {
            background: var(--primary);
            color: white;
        }

        .success-popup .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .success-popup .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .success-popup .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(-20px) scale(0.9);
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 768px) {
            .checkout-content {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header class="shoppee-header">
        <img src="/images/logo.png" alt="TORQUEHUB Logo" class="shoppee-logo">
        <h1>TORQUEHUB CHECKOUT</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="main-nav-strip">
        <div class="nav-strip-container">
            <ul class="nav-strip-list">
                <li class="nav-strip-item">
                    <a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-strip-item">
                    <a href="/cart"><i class="fas fa-shopping-cart"></i> Cart</a>
                </li>
                <li class="nav-strip-item nav-icon nav-checkout">
                    <a href="/checkout" aria-label="Checkout" style="background: var(--primary); color: white;">
                        <i class="fas fa-credit-card"></i> Checkout
                    </a>
                </li>
                <li class="nav-strip-item" id="my-orders-link">
                    <a href="/transaction-management"><i class="fas fa-list"></i> My Orders</a>
                </li>
                <li class="nav-strip-item">
                    <a href="/purchase-history"><i class="fas fa-history"></i> Purchase History</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="checkout-container">
        <div class="checkout-header">
            <h1><i class="fas fa-credit-card"></i> Complete Your Order</h1>
            <p>Please provide your shipping and payment information</p>
        </div>

        <div class="checkout-content">
            <!-- Checkout Form -->
            <div class="checkout-form">
                <form id="checkoutForm">
                    <!-- Shipping Information -->
                    <div class="form-section">
                        <h3><i class="fas fa-shipping-fast"></i> Shipping Information</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name *</label>
                                <input type="text" id="firstName" name="firstName" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name *</label>
                                <input type="text" id="lastName" name="lastName" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Street Address *</label>
                            <input type="text" id="address" name="address" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city" required>
                            </div>
                            <div class="form-group">
                                <label for="state">State *</label>
                                <input type="text" id="state" name="state" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="zipCode">ZIP Code *</label>
                                <input type="text" id="zipCode" name="zipCode" required>
                            </div>
                            <div class="form-group">
                                <label for="country">Country *</label>
                                <select id="country" name="country" required>
                                    <option value="">Select Country</option>
                                    <option value="US">United States</option>
                                    <option value="CA">Canada</option>
                                    <option value="UK">United Kingdom</option>
                                    <option value="AU">Australia</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Information -->
                    <div class="form-section">
                        <h3><i class="fas fa-credit-card"></i> Payment Information</h3>
                        <div class="form-group">
                            <label for="cardNumber">Card Number *</label>
                            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiryDate">Expiry Date *</label>
                                <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" required>
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV *</label>
                                <input type="text" id="cvv" name="cvv" placeholder="123" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="cardName">Name on Card *</label>
                            <input type="text" id="cardName" name="cardName" required>
                        </div>
                    </div>

                    <!-- Order Notes -->
                    <div class="form-section">
                        <h3><i class="fas fa-sticky-note"></i> Order Notes</h3>
                        <div class="form-group">
                            <label for="orderNotes">Special Instructions (Optional)</label>
                            <textarea id="orderNotes" name="orderNotes" rows="3" placeholder="Any special instructions for your order..."></textarea>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Order Summary -->
            <div class="order-summary">
                <div class="summary-header">
                    <i class="fas fa-receipt"></i> Order Summary
                </div>
                <div id="orderItems">
                    <!-- Order items will be loaded here -->
                </div>
                <div class="total-section">
                    <div class="total-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="total-row">
                        <span>Tax (10%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="total-row">
                        <span>Shipping:</span>
                        <span id="shipping">$0.00</span>
                    </div>
                    <div class="total-row final">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                </div>
                <button class="place-order-btn" id="placeOrderBtn" disabled>
                    <i class="fas fa-lock"></i> Place Order
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let products = [];

        // Load products and display order summary
        async function loadOrderSummary() {
            try {
                const response = await fetch('/api/products', {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    products = await response.json();
                    displayOrderSummary();
                } else {
                    throw new Error('Failed to load products');
                }
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function displayOrderSummary() {
            const orderItemsContainer = document.getElementById('orderItems');
            
            if (cart.length === 0) {
                document.querySelector('.checkout-container').innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>Your cart is empty</h3>
                        <p>Add some products to your cart before checkout!</p>
                        <a href="/dashboard" class="continue-shopping-btn">
                            <i class="fas fa-arrow-left"></i> Continue Shopping
                        </a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            const orderItemsHTML = cart.map(item => {
                const product = products.find(p => p.id === item.productId);
                if (!product) return '';

                const itemTotal = product.price * item.quantity;
                subtotal += itemTotal;
                
                return `
                    <div class="order-item">
                        <div class="item-name">${product.name} x${item.quantity}</div>
                        <div class="item-price">$${itemTotal.toLocaleString()}</div>
                    </div>
                `;
            }).join('');

            orderItemsContainer.innerHTML = orderItemsHTML;

            const tax = subtotal * 0.10;
            const shipping = subtotal > 0 ? 25 : 0;
            const total = subtotal + tax + shipping;

            document.getElementById('subtotal').textContent = `$${subtotal.toLocaleString()}`;
            document.getElementById('tax').textContent = `$${tax.toLocaleString()}`;
            document.getElementById('shipping').textContent = `$${shipping.toLocaleString()}`;
            document.getElementById('total').textContent = `$${total.toLocaleString()}`;

            // Enable place order button if cart has items
            document.getElementById('placeOrderBtn').disabled = cart.length === 0;
        }

        // Place order functionality
        document.getElementById('placeOrderBtn').addEventListener('click', async function() {
            const form = document.getElementById('checkoutForm');
            
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Show processing state
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            this.disabled = true;

            try {
                // Create transactions for each item in cart
                const createdTransactions = [];
                const orderItems = [];
                
                for (const item of cart) {
                    const product = products.find(p => p.id === item.productId);
                    if (!product) continue;

                    const formData = new FormData(form);
                    const shippingAddress = `${formData.get('address')}, ${formData.get('city')}, ${formData.get('state')} ${formData.get('zipCode')}, ${formData.get('country')}`;
                    
                    const transactionData = {
                        product_id: item.productId,
                        quantity: item.quantity,
                        payment_method: 'Credit Card',
                        shipping_address: shippingAddress,
                        notes: formData.get('orderNotes') || `Order placed by ${formData.get('firstName')} ${formData.get('lastName')}`
                    };

                    const response = await fetch('/api/transactions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        credentials: 'include',
                        body: JSON.stringify(transactionData)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        createdTransactions.push(result.transaction);
                        
                        // Add to order items for email
                        orderItems.push({
                            product: product,
                            quantity: item.quantity,
                            transaction: result.transaction
                        });
                    } else {
                        throw new Error(`Failed to create transaction for product ${item.productId}`);
                    }
                }

                // Send comprehensive email receipt with all order items
                if (createdTransactions.length > 0) {
                    try {
                        const formData = new FormData(form);
                        const userInfo = {
                            full_name: `${formData.get('firstName')} ${formData.get('lastName')}`,
                            email: formData.get('email')
                        };
                        
                        const totalAmount = createdTransactions.reduce((sum, t) => sum + parseFloat(t.total_amount), 0);
                        
                        // Send email with all order details
                        const emailResponse = await fetch('/api/transactions/send-order-receipt', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            credentials: 'include',
                            body: JSON.stringify({
                                transactions: createdTransactions,
                                orderItems: orderItems,
                                userInfo: userInfo,
                                totalAmount: totalAmount,
                                shippingAddress: `${formData.get('address')}, ${formData.get('city')}, ${formData.get('state')} ${formData.get('zipCode')}, ${formData.get('country')}`
                            })
                        });
                        
                        if (emailResponse.ok) {
                            console.log('✅ Order receipt email sent successfully');
                        } else {
                            console.error('❌ Failed to send order receipt email');
                        }
                    } catch (emailError) {
                        console.error('❌ Error sending order receipt email:', emailError);
                    }
                }

                // Clear cart
                localStorage.removeItem('cart');
                
                // Show success popup with transaction details
                const totalAmount = createdTransactions.reduce((sum, t) => sum + parseFloat(t.total_amount), 0);
                showSuccessPopup(totalAmount, createdTransactions.length);
                
            } catch (error) {
                console.error('Error placing order:', error);
                alert('Failed to place order. Please try again.');
                
                // Reset button state
                this.innerHTML = '<i class="fas fa-lock"></i> Place Order';
                this.disabled = false;
            }
        });

        // Show success popup function
        function showSuccessPopup(totalAmount, itemCount) {
            const popupHTML = `
                <div class="success-popup-overlay" id="successPopup">
                    <div class="success-popup">
                        <i class="fas fa-check-circle"></i>
                        <h3>Order Placed Successfully!</h3>
                        <p>Your order has been recorded and is now available in the Transaction Management section.</p>
                        
                        <div class="order-details">
                            <h4>Order Summary:</h4>
                            <p><strong>Total Amount:</strong> $${totalAmount.toLocaleString()}</p>
                            <p><strong>Number of Items:</strong> ${itemCount}</p>
                            <p><strong>Status:</strong> Pending</p>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', popupHTML);
            
            // Add click event to close popup when clicking overlay
            document.getElementById('successPopup').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.remove();
                    // Redirect to dashboard when popup is closed
                    window.location.href = '/dashboard';
                }
            });
            
            // Auto-close popup after 5 seconds and redirect to dashboard
            setTimeout(() => {
                const popup = document.getElementById('successPopup');
                if (popup) {
                    popup.remove();
                    // Redirect to dashboard
                    window.location.href = '/dashboard';
                }
            }, 5000);
        }

        // User profile management
        async function fetchUserProfile() {
            try {
                const response = await fetch('/api/profile?t=' + Date.now(), {
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        // User not authenticated, redirect to login
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const user = await response.json();
                updateMyOrdersLinkVisibility(user);
            } catch (error) {
                console.error('Profile error:', error);
                // Hide My Orders link for guests
                const myOrdersLink = document.getElementById('my-orders-link');
                if (myOrdersLink) {
                    myOrdersLink.style.display = 'none';
                }
            }
        }

        function updateMyOrdersLinkVisibility(user) {
            const myOrdersLink = document.getElementById('my-orders-link');
            
            if (myOrdersLink) {
                if (user.role && user.role.toLowerCase() === 'admin') {
                    myOrdersLink.style.display = 'block';
                } else {
                    myOrdersLink.style.display = 'none';
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadOrderSummary();
            fetchUserProfile();
        });
    </script>
</body>
</html>
