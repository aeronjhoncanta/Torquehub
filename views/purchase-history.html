<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase History - TorqueHub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <style>
        .purchase-history-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .purchase-history-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .purchase-history-header h1 {
            color: var(--primary-dark);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .purchase-history-header p {
            color: var(--text);
            font-size: 1.1rem;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(179,153,212,0.1);
            border: 1px solid var(--primary-light);
            text-align: center;
        }

        .stat-card i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .stat-card h3 {
            color: var(--primary-dark);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            color: var(--text);
            font-size: 1rem;
        }

        .filters-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(179,153,212,0.1);
            border: 1px solid var(--primary-light);
            margin-bottom: 2rem;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .filter-group input,
        .filter-group select {
            padding: 0.8rem;
            border: 2px solid var(--primary-light);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(179,153,212,0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 1rem;
            align-items: end;
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.primary {
            background: var(--primary);
            color: white;
        }

        .filter-btn.primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .filter-btn.secondary {
            background: #6c757d;
            color: white;
        }

        .filter-btn.secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .transactions-table {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(179,153,212,0.1);
            border: 1px solid var(--primary-light);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .table-header h3 {
            color: var(--primary-dark);
            font-size: 1.5rem;
            margin: 0;
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-shipped {
            background: #d4edda;
            color: #155724;
        }

        .status-delivered {
            background: #c3e6cb;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .transaction-details {
            background: var(--primary-light);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .transaction-details h4 {
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .transaction-details p {
            margin: 0.25rem 0;
            color: var(--text);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--primary-light);
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary-dark);
        }

        .empty-state p {
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .start-shopping-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .start-shopping-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .filters-row {
                grid-template-columns: 1fr;
            }

            .filter-buttons {
                flex-direction: column;
            }

            .stats-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header class="shoppee-header">
        <img src="/images/logo.png" alt="TORQUEHUB Logo" class="shoppee-logo">
        <h1>TORQUEHUB PURCHASE HISTORY</h1>
    </header>

    <!-- Navigation Bar -->
    <nav class="main-nav-strip">
        <div class="nav-strip-container">
            <ul class="nav-strip-list">
                <li class="nav-strip-item">
                    <a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-strip-item">
                    <a href="/cart"><i class="fas fa-shopping-cart"></i> Cart</a>
                </li>
                <li class="nav-strip-item">
                    <a href="/checkout"><i class="fas fa-credit-card"></i> Checkout</a>
                </li>
                <li class="nav-strip-item nav-icon nav-history">
                    <a href="/purchase-history" aria-label="Purchase History" style="background: var(--primary); color: white;">
                        <i class="fas fa-history"></i> Purchase History
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="purchase-history-container">
        <div class="purchase-history-header">
            <h1><i class="fas fa-history"></i> Purchase History</h1>
            <p>View and track all your past orders and transactions</p>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-cards">
            <div class="stat-card">
                <i class="fas fa-shopping-bag"></i>
                <h3 id="totalOrders">0</h3>
                <p>Total Orders</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-dollar-sign"></i>
                <h3 id="totalSpent">$0</h3>
                <p>Total Spent</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <h3 id="pendingOrders">0</h3>
                <p>Pending Orders</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle"></i>
                <h3 id="completedOrders">0</h3>
                <p>Completed Orders</p>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="filters-section">
            <div class="filters-row">
                <div class="filter-group">
                    <label for="searchInput">Search Orders</label>
                    <input type="text" id="searchInput" placeholder="Search by product name, order ID...">
                </div>
                <div class="filter-group">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="dateFilter">Date Range</label>
                    <input type="date" id="dateFilter">
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn primary" onclick="applyFilters()">
                        <i class="fas fa-filter"></i> Apply Filters
                    </button>
                    <button class="filter-btn secondary" onclick="clearFilters()">
                        <i class="fas fa-times"></i> Clear
                    </button>
                </div>
            </div>
        </div>

        <!-- Transactions Table -->
        <div class="transactions-table">
            <div class="table-header">
                <h3><i class="fas fa-list"></i> Your Orders</h3>
            </div>
            <div id="transactionsTable">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading your purchase history...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script>
        let transactions = [];
        let dataTable = null;

        // Load purchase history
        async function loadPurchaseHistory() {
            try {
                const response = await fetch('/api/transactions/my-transactions', {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    transactions = await response.json();
                    updateStatistics();
                    displayTransactions();
                } else {
                    throw new Error('Failed to load purchase history');
                }
            } catch (error) {
                console.error('Error loading purchase history:', error);
                showEmptyState();
            }
        }

        // Update statistics
        function updateStatistics() {
            const totalOrders = transactions.length;
            const totalSpent = transactions.reduce((sum, t) => sum + parseFloat(t.total_amount), 0);
            const pendingOrders = transactions.filter(t => t.status === 'pending').length;
            const completedOrders = transactions.filter(t => 
                ['confirmed', 'shipped', 'delivered'].includes(t.status)
            ).length;

            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('totalSpent').textContent = `$${totalSpent.toLocaleString()}`;
            document.getElementById('pendingOrders').textContent = pendingOrders;
            document.getElementById('completedOrders').textContent = completedOrders;
        }

        // Display transactions
        function displayTransactions() {
            const tableContainer = document.getElementById('transactionsTable');
            
            if (transactions.length === 0) {
                showEmptyState();
                return;
            }

            const tableHTML = `
                <table id="transactionsDataTable" class="display" style="width:100%">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Total Amount</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${transactions.map(transaction => `
                            <tr>
                                <td>#${transaction.id}</td>
                                <td>
                                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                                        <img src="${transaction.Product?.image || '/images/illus.png'}" 
                                             alt="${transaction.Product?.name}" 
                                             style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;"
                                             onerror="this.src='/images/illus.png'">
                                        <span>${transaction.Product?.name || 'Product'}</span>
                                    </div>
                                </td>
                                <td>${transaction.quantity}</td>
                                <td>$${parseFloat(transaction.total_amount).toLocaleString()}</td>
                                <td>
                                    <span class="status-badge status-${transaction.status}">
                                        ${transaction.status}
                                    </span>
                                </td>
                                <td>${new Date(transaction.createdAt).toLocaleDateString()}</td>
                                <td>
                                    <button class="filter-btn primary" onclick="viewTransactionDetails(${transaction.id})" style="padding: 0.5rem 1rem; font-size: 0.9rem;">
                                        <i class="fas fa-eye"></i> View
                                    </button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            tableContainer.innerHTML = tableHTML;

            // Initialize DataTable
            if (dataTable) {
                dataTable.destroy();
            }

            dataTable = $('#transactionsDataTable').DataTable({
                responsive: true,
                pageLength: 10,
                order: [[5, 'desc']], // Sort by date descending
                language: {
                    search: "Search orders:",
                    lengthMenu: "Show _MENU_ orders per page",
                    info: "Showing _START_ to _END_ of _TOTAL_ orders",
                    paginate: {
                        first: "First",
                        last: "Last",
                        next: "Next",
                        previous: "Previous"
                    }
                }
            });
        }

        // Show empty state
        function showEmptyState() {
            const tableContainer = document.getElementById('transactionsTable');
            tableContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-shopping-bag"></i>
                    <h3>No purchase history found</h3>
                    <p>You haven't made any orders yet. Start shopping to see your purchase history here!</p>
                    <a href="/dashboard" class="start-shopping-btn">
                        <i class="fas fa-shopping-cart"></i> Start Shopping
                    </a>
                </div>
            `;
        }

        // View transaction details
        function viewTransactionDetails(transactionId) {
            const transaction = transactions.find(t => t.id === transactionId);
            if (!transaction) return;

            const detailsHTML = `
                <div class="transaction-details">
                    <h4>Order Details - #${transaction.id}</h4>
                    <p><strong>Product:</strong> ${transaction.Product?.name || 'Product'}</p>
                    <p><strong>Quantity:</strong> ${transaction.quantity}</p>
                    <p><strong>Total Amount:</strong> $${parseFloat(transaction.total_amount).toLocaleString()}</p>
                    <p><strong>Status:</strong> <span class="status-badge status-${transaction.status}">${transaction.status}</span></p>
                    <p><strong>Payment Method:</strong> ${transaction.payment_method || 'Not specified'}</p>
                    <p><strong>Shipping Address:</strong> ${transaction.shipping_address || 'Not specified'}</p>
                    <p><strong>Order Date:</strong> ${new Date(transaction.createdAt).toLocaleString()}</p>
                    ${transaction.notes ? `<p><strong>Notes:</strong> ${transaction.notes}</p>` : ''}
                </div>
            `;

            // Show details in a modal or expand the row
            alert(detailsHTML.replace(/<[^>]*>/g, '')); // Simple alert for now
        }

        // Apply filters
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;

            if (dataTable) {
                dataTable.draw();
            }
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            document.getElementById('dateFilter').value = '';

            if (dataTable) {
                dataTable.search('').columns().search('').draw();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadPurchaseHistory();
        });
    </script>
</body>
</html>
